name: DuoBalance QA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC: 03:00 Madrid is 01:00 UTC in summer, 02:00 in winter.
    - cron: '0 1,2 * * *'

permissions:
  contents: read

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schedule:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.madrid.outputs.run }}
    steps:
      - id: madrid
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != schedule ] || [ "$(TZ=Europe/Madrid date +%H)" = 03 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  quality:
    needs: schedule
    if: needs.schedule.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run lint:arch

  ui:
    needs: [schedule, quality]
    if: needs.schedule.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: ${{ vars.BASE_URL || 'https://roaragonesc.github.io/duobalance/' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
